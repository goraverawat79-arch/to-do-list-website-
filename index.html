<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- TO-DO-LIST CONATIENR -->
        <div class="todo-app">
            <h2>To-Do-list <img src="images/icon.png" alt="TO-DO-LIST"></h2>

            <!-- all the input , output -->

            <div class="row">
                <input type="text" id="input-box" placeholder="Add new task">
                <button onclick="addtask()" id="add-btn">Add</button>
            </div>


            <!-- Progress Section -->
  <div class="progress-section"> 
    
    <div class="progress-info"> 
        <span>Task Progress</span> 
        <span id="progress-text">0%</span> </div>

         <div class="progress-bar">
            
            <div id="progress-fill"></div> 
        </div>
     </div>
     
            <!-- code for unorder list -->
                 <ul id="list-container">
               
                 </ul>

        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
